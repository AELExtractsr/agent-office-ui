<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#121212; --panel:rgba(22,22,26,.74); --panel-solid:#17171a; --line:rgba(255,255,255,.085);
  --txt:#f3f3f6; --mut:#9b9ba8; --dim:#6b6b78; --r:12px; --sb:340px;
  --working:#3ddc84; --needs:#ff9d2e; --idle:#a78bfa; --error:#ff4d5e;
  --lampO:1; --monO:1; --neonO:1; --botO:1; --dayO:0;
  --font: Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
body.mode-day{--lampO:0;--monO:.16;--neonO:.38;--botO:.3;--dayO:1}
body.mode-evening{--lampO:.72;--monO:.55;--neonO:.8;--botO:.7;--dayO:.5}
body.mode-night{--lampO:1;--monO:1;--neonO:1;--botO:1;--dayO:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- viewport / scene layers ---------- */
#viewport{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:#151517}
#bg{position:absolute;inset:-60px;background:
  radial-gradient(60% 55% at 38% 52%, #26272d 0%, #1a1b1f 55%, #121214 100%);}
#bg::after{content:"";position:absolute;inset:0;opacity:.55;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(70% 70% at 40% 50%, #000 20%, transparent 85%);mask-image:radial-gradient(70% 70% at 40% 50%, #000 20%, transparent 85%)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;display:block}
#svgShadowCast{filter:blur(6px);opacity:.34}
#svgShadowContact{filter:blur(1.6px);opacity:.5}
#stageB{mix-blend-mode:screen;pointer-events:none}
#stageB svg{will-change:opacity;transition:opacity 1.3s ease}
#glowDay{opacity:var(--dayO)}
#glowNeon{opacity:var(--neonO)}
#glowLamps{opacity:var(--lampO)}
#glowScreens{opacity:var(--monO)}
#glowBots{opacity:var(--botO)}
/* avatar self-illumination + rim light (screen-blended over the night/evening tint; off by day) */
.selflit{opacity:0;transition:opacity 1.3s ease}
body.mode-evening .selflit{opacity:.55}
body.mode-night .selflit{opacity:1}

#glowNeon .flick{animation:flick 7.3s infinite steps(1,end)}
#glowNeon .flick2{animation:flick 9.1s 2.4s infinite steps(1,end)}
#glowNeon .flick3{animation:flickx 6.1s 1s infinite steps(1,end)}
#glowNeon .neon-x{animation:neonOnX .9s 1.55s both steps(1,end)}
@keyframes neonOn{0%{opacity:0}18%{opacity:.7}24%{opacity:.1}40%{opacity:.85}48%{opacity:.3}60%,100%{opacity:1}}
@keyframes neonOnX{0%{opacity:0}20%{opacity:.8}30%{opacity:0}52%{opacity:.6}60%{opacity:.15}75%,100%{opacity:1}}
@keyframes flickx{0%,100%{opacity:1}31%{opacity:.6}31.5%{opacity:1}74%{opacity:.75}74.6%{opacity:1}}
@media (prefers-reduced-motion:reduce){#glowNeon .flick,#glowNeon .flick2,#glowNeon .flick3,#glowNeon .neon-x{animation:none!important;opacity:1}}
@keyframes flick{0%,100%{opacity:1}12%{opacity:.82}12.6%{opacity:1}57%{opacity:1}57.4%{opacity:.5}58%{opacity:1}58.6%{opacity:.7}59.2%{opacity:1}}
#daylight{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:var(--dayO);transition:opacity 1.3s ease;
  background:radial-gradient(70% 60% at 22% 8%, rgba(255,246,222,.30), rgba(255,246,222,0) 70%), radial-gradient(90% 80% at 50% 40%, rgba(255,255,255,.07), transparent 70%)}
#tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background:#fffdf9;transition:background-color 1.4s ease}
body.mode-day #tint{background:#fffdf8}
body.mode-evening #tint{background:#ffb685}
body.mode-night #tint{background:#6577c4}
#tint2{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.4s ease;mix-blend-mode:soft-light;
  background:linear-gradient(180deg,#1b1250 0%,#331a6e 55%,#0b1b4a 100%)}
body.mode-night #tint2{opacity:.55}
body.mode-evening #tint2{opacity:.0}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(75% 75% at 40% 52%, transparent 55%, rgba(0,0,0,.55) 100%)}
.tilt{position:absolute;left:0;right:0;pointer-events:none}
.tilt.top{top:0;height:12%}
.tilt.bot{bottom:0;height:17%}
.tilt i{position:absolute;inset:0;display:block}
.tilt.top i:nth-child(1){backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,transparent 100%)}
.tilt.bot i:nth-child(1){backdrop-filter:blur(3.5px);-webkit-backdrop-filter:blur(3.5px);-webkit-mask-image:linear-gradient(0deg,#000 0%,transparent 100%);mask-image:linear-gradient(0deg,#000 0%,transparent 100%)}
#motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#motes b{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(1px);animation:mote linear infinite}
@keyframes mote{0%{transform:translate3d(0,20px,0);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translate3d(30px,-120px,0);opacity:0}}
body.mode-night #motes b{background:rgba(160,200,255,.6)}

/* scene css animations */
.desk .scr-on,.desk .scr-err{opacity:0;transition:opacity .7s ease}
.desk[data-s="on"] .scr-on{opacity:1}
.desk[data-s="err"] .scr-err{opacity:1}
.scr-on .ln{animation:ln 3.2s ease-in-out infinite}
.scr-on .ln:nth-child(2n){animation-duration:4.1s;animation-delay:-1s}
.scr-on .ln:nth-child(3n){animation-duration:2.6s;animation-delay:-.4s}
@keyframes ln{0%,100%{opacity:.9}50%{opacity:.35}}
.scr-err .blink{animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:.15}}
.leafs{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5.5s ease-in-out infinite}
.leafs.b{animation-duration:7s;animation-delay:-2s}
.rt{transform-box:fill-box;transform-origin:50% 0;animation:rtsw 3.8s ease-in-out infinite}
.rt.b{animation-duration:4.9s;animation-delay:-1.7s}
@keyframes rtsw{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.5deg)}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.8deg)}}
.bubbles circle{animation:rise 2.6s ease-in infinite;transform-box:fill-box}
.bubbles circle:nth-child(2){animation-delay:-.9s;animation-duration:3.1s}
.bubbles circle:nth-child(3){animation-delay:-1.7s;animation-duration:2.3s}
.bubbles circle:nth-child(4){animation-delay:-.4s;animation-duration:3.4s}
@keyframes rise{0%{transform:translateY(5px);opacity:0}20%{opacity:.95}100%{transform:translateY(-15px);opacity:0}}
.bulb{opacity:var(--lampO);transition:opacity 1.3s ease}
.sky-day,.sky-eve,.sky-night{transition:opacity 1.3s ease;opacity:0}
body.mode-day .sky-day{opacity:1}
body.mode-evening .sky-eve{opacity:1}
body.mode-night .sky-night{opacity:1}
.gd-day,.gd-eve,.gd-night{transition:opacity 1.3s ease;opacity:0}
body.mode-day .gd-day{opacity:1}
body.mode-evening .gd-eve{opacity:1}
body.mode-night .gd-night{opacity:.9}
.coil{animation:coil 2s linear infinite}
@keyframes coil{to{stroke-dashoffset:-12}}
.heat{animation:heat 2.4s ease-in-out infinite}
@keyframes heat{0%,100%{opacity:.75}50%{opacity:1}}
.bot .ring ellipse{transition:opacity .4s}

/* ---------- labels ---------- */
#labels{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.tag .in{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.tag .plate{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:99px;
  background:rgba(13,13,16,.82);border:1px solid rgba(255,255,255,.13);font:600 11px/1.25 var(--font);color:#f4f4f7;
  box-shadow:0 4px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07);letter-spacing:.1px}
.tag .plate i{width:8px;height:8px;border-radius:50%;background:var(--bc);box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 9px var(--bc)}
.tag .plate em{font-style:normal;width:7px;height:7px;border-radius:50%;margin-left:1px;background:var(--sc);box-shadow:0 0 7px var(--sc)}
.tag .bw{width:max-content;max-width:230px;position:absolute;left:50%;bottom:100%;margin-bottom:5px;transform:translate(calc(-50% + var(--bx,0px)),var(--by,0px));display:none;flex-direction:column;align-items:center}
.tag.hasb .bw{display:flex}
.tag .bubble{pointer-events:none;max-width:210px;white-space:normal;text-align:left;padding:7px 11px 8px;border-radius:13px;font:500 11.5px/1.35 var(--font);
  color:#f2f2f6;background:rgba(17,17,21,.93);border:1px solid color-mix(in srgb,var(--bc) 55%,rgba(255,255,255,.1));
  box-shadow:0 8px 24px rgba(0,0,0,.5), 0 0 18px color-mix(in srgb,var(--bc) 22%,transparent);
  opacity:0;transform:translateY(8px) scale(.92);transform-origin:50% 100%;transition:opacity .25s ease, transform .25s cubic-bezier(.3,1.4,.5,1)}
.tag.showb .bubble{opacity:1;transform:none}
.tag.cmp .bubble{max-width:158px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;padding:6px 10px 7px}
.tag.cmp .bubble b{display:inline;margin-right:5px}
.tag .bubble b{font-weight:700;color:var(--bc);display:block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:1px}
.tag .tail{height:9px;width:14px;position:relative;margin-bottom:0;display:none;transform:translateX(calc(var(--bx,0px) * -1))}
.tag.hasb .tail{display:block}
.tag .tail::before{content:"";position:absolute;left:50%;top:-1px;width:10px;height:10px;transform:translateX(-50%) rotate(45deg);background:rgba(17,17,21,.93);
  border-right:1px solid color-mix(in srgb,var(--bc) 55%,rgba(255,255,255,.1));border-bottom:1px solid color-mix(in srgb,var(--bc) 55%,rgba(255,255,255,.1));top:-6px}
.tag .tail.thought::before{display:none}
.tag .tail.thought i{position:absolute;border-radius:50%;background:rgba(17,17,21,.93);border:1px solid color-mix(in srgb,var(--bc) 55%,rgba(255,255,255,.1))}
.tag .tail.thought i:nth-child(1){width:7px;height:7px;left:calc(50% - 3px);top:-1px}
.tag .tail.thought i:nth-child(2){width:4px;height:4px;left:calc(50% + 1px);top:7px}
.tag.below .in{bottom:auto;top:0;flex-direction:column-reverse}
.tag.below .bw{bottom:auto;top:100%;margin:5px 0 0;flex-direction:column-reverse}
.tag.below .bubble{transform-origin:50% 0}
.tag.below .tail{transform:translateX(calc(var(--bx,0px) * -1)) rotate(180deg)}
.tag.below .zzz{bottom:auto;top:-16px}
.tag .zzz{position:absolute;left:calc(100% - 4px);bottom:-14px;font:700 12px var(--font);color:#c9b8ff;letter-spacing:3px;text-shadow:0 0 8px rgba(167,139,250,.9);display:none;animation:zz 3s ease-in-out infinite}
.tag.sleeping .zzz{display:block}
@keyframes zz{0%{transform:translate(0,6px);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
.tag.sel .plate{border-color:color-mix(in srgb,var(--bc) 70%,#fff 10%);box-shadow:0 0 0 2px color-mix(in srgb,var(--bc) 28%,transparent),0 4px 14px rgba(0,0,0,.45)}
.dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--bc);margin-right:3px;animation:dt 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- UI chrome ---------- */
.glass{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05)}
#header{position:absolute;left:20px;top:18px;display:flex;align-items:center;gap:16px;z-index:10;flex-wrap:wrap;max-width:calc(100% - var(--sb) - 60px)}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#ffd45a,#ff5fa8);display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,95,168,.3), inset 0 1px 0 rgba(255,255,255,.5)}
.logo h1{font-size:17px;font-weight:700;letter-spacing:-.2px}
.logo h1 span{color:var(--mut);font-weight:500}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:99px;font-size:12px;color:#d9d9e0;background:rgba(22,22,26,.7);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pill.live i{--c:#3ddc84}.pill.live.demo i{--c:#ffb23f}.pill.live.on i{animation:lvp 1.6s ease-in-out infinite}
@keyframes lvp{50%{opacity:.35}}
#feedLive .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3ddc84;margin-right:6px;box-shadow:0 0 8px #3ddc84}#feedLive .dot.demo{background:#ffb23f;box-shadow:0 0 8px #ffb23f}
.pill b{font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.pill.free i{border-radius:2px;background:transparent;border:1.5px solid #8fa0b8;box-shadow:none}
.pill.err{display:none}.pill.err.on{display:inline-flex}
#sidebar{position:absolute;right:14px;top:14px;bottom:14px;width:var(--sb);display:flex;flex-direction:column;gap:10px;z-index:10}
.panel{padding:12px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);font-weight:600}
.ph span.n{font-variant-numeric:tabular-nums;color:var(--dim)}
#team{flex:0 1 auto;min-height:150px;display:flex;flex-direction:column;overflow:hidden}
#teamList{overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s}
.row:hover{background:rgba(255,255,255,.045)}
.row.sel{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.1)}
.row .ico{width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;background:linear-gradient(150deg,color-mix(in srgb,var(--bc) 90%,#fff 10%),color-mix(in srgb,var(--bc) 55%,#000));box-shadow:0 3px 10px color-mix(in srgb,var(--bc) 35%,transparent), inset 0 1px 0 rgba(255,255,255,.35)}
.row .ico svg{display:block}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rl{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.badge{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c)}
.st-working{--c:var(--working)}.st-needs{--c:var(--needs)}.st-idle{--c:var(--idle)}.st-error{--c:var(--error)}
#task{flex:none}
.tk-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tk-h .ico{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;background:linear-gradient(150deg,color-mix(in srgb,var(--bc) 90%,#fff 10%),color-mix(in srgb,var(--bc) 55%,#000));box-shadow:0 3px 12px color-mix(in srgb,var(--bc) 40%,transparent), inset 0 1px 0 rgba(255,255,255,.35)}
.tk-h .t{flex:1;min-width:0}.tk-h .t b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tk-h .t span{font-size:11px;color:var(--mut)}
.tk-name{font-size:14px;font-weight:650;line-height:1.3;margin-bottom:8px}
.stepline{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:6px}
.stepline b{color:#fff;font-weight:600}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.bars i{height:4px;border-radius:3px;background:rgba(255,255,255,.1);display:block;overflow:hidden;position:relative}
.bars i.d{background:var(--bc)}
.bars i.c{background:linear-gradient(90deg,var(--bc) 0 45%,rgba(255,255,255,.1) 45%)}
.bars i.c::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shim 1.8s infinite}
.bars i.w{background:var(--needs);opacity:.9}.bars i.e{background:var(--error)}
@keyframes shim{to{transform:translateX(100%)}}
.chk{list-style:none;display:flex;flex-direction:column;gap:4px;margin-bottom:2px}
.chk li{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.35;color:var(--mut)}
.chk li .ic{flex:none;width:15px;height:15px;border-radius:50%;margin-top:0;display:grid;place-items:center;font-size:9px;border:1.5px solid rgba(255,255,255,.2);color:#000}
.chk li.d{color:#cfcfd8}.chk li.d .ic{background:var(--working);border-color:var(--working)}
.chk li.c{color:#fff;font-weight:500}.chk li.c .ic{border-color:var(--bc);box-shadow:0 0 0 3px color-mix(in srgb,var(--bc) 20%,transparent);position:relative}
.chk li.c .ic::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--bc);animation:pul 1.2s infinite}
.chk li.w{color:#ffd9a3}.chk li.w .ic{background:var(--needs);border-color:var(--needs)}
.chk li.e{color:#ffb4bb}.chk li.e .ic{background:var(--error);border-color:var(--error)}
@keyframes pul{50%{transform:scale(.4);opacity:.5}}
.callout{margin:10px 0 10px;padding:9px 11px;border-radius:10px;font-size:11.5px;line-height:1.4;background:color-mix(in srgb,var(--cc) 10%,rgba(0,0,0,.2));border:1px solid color-mix(in srgb,var(--cc) 35%,transparent);color:#e8e8ee}
.callout b{display:block;color:var(--cc);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
.btns{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.btn{width:100%;height:40px;border-radius:11px;font-weight:700;font-size:13.5px;letter-spacing:.1px;transition:transform .12s, filter .15s, box-shadow .2s}
.btn:active{transform:scale(.985)}
.btn.ap{color:#2a1200;background:linear-gradient(100deg,#ffd23f 0%,#ff9a3c 45%,#ff4f9a 100%);box-shadow:0 6px 22px rgba(255,120,80,.32), inset 0 1px 0 rgba(255,255,255,.5)}
.btn.ap:hover{filter:brightness(1.08);box-shadow:0 8px 28px rgba(255,120,80,.45), inset 0 1px 0 rgba(255,255,255,.5)}
.btn.dc{background:#2a2a30;color:#e8e8ee;border:1px solid rgba(255,255,255,.08)}
.btn.dc:hover{background:#34343b}
.nudge{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.nudge textarea{width:100%;box-sizing:border-box;resize:vertical;min-height:44px;border-radius:10px;background:#16161b;color:#e8e8ee;border:1px solid rgba(255,255,255,.1);padding:7px 9px;font:inherit;font-size:12.5px}
.nudge .btn{height:32px;font-size:12.5px}
.cmdh{list-style:none;margin:8px 0 0;padding:0;font-size:11.5px;color:#b9bac4;display:flex;flex-direction:column;gap:3px}
.cmdh li{display:flex;gap:6px;align-items:baseline;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cmdh .cs{margin-left:auto;padding:1px 6px;border-radius:8px;font-size:10.5px;background:#2a2a30;flex-shrink:0}
.cmdh .cs-delivered{background:#2b3b55;color:#9fc4ff}.cmdh .cs-seen{background:#1f4630;color:#8ff0b0}
.empty{color:var(--mut);font-size:12px;padding:6px 2px}
#collabs{flex:none;padding:9px 12px}
#collabs[hidden]{display:none}
#collabs .ph{margin-bottom:5px}
#collabList .cp{display:flex;flex-direction:column;gap:1px;font-size:11.5px;padding:3px 0;border-top:1px solid rgba(255,255,255,.05)}
#collabList .cp:first-child{border-top:0}
#collabList .pr{font-weight:600;color:#dfe6f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#collabList .pr i{font-style:normal;color:#6b7688;margin:0 5px}
#collabList .tk{color:#8792a4;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#glowCollab{opacity:calc(.55 + var(--botO)*.45)}
#glowCollab .arc{transition:opacity 1.2s ease}
#glowCollab .pulse{animation:collabPulse 3.6s linear infinite}
@keyframes collabPulse{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#glowCollab .pulse{display:none}#glowCollab .arc{transition:none}}
#feed{flex:1 1 120px;min-height:96px;display:flex;flex-direction:column;overflow:hidden;padding-bottom:6px}
#feedList{flex:1;overflow:auto;font:11px/1.55 var(--mono);color:#a9b3c2;scrollbar-width:thin;scrollbar-color:#333 transparent;padding-right:4px;margin-right:-4px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14px);mask-image:linear-gradient(180deg,transparent 0,#000 14px)}
#feedList div{white-space:normal;word-break:break-word;animation:fin .4s ease}
#feedList .t{color:#566174;margin-right:6px}
#feedList .who{font-weight:700;margin-right:5px}
#feedList .k-warn{color:#ffc56b}#feedList .k-err{color:#ff8b95}#feedList .k-ok{color:#7ff0ae}
@keyframes fin{from{opacity:0;transform:translateY(5px)}}
#dock{position:absolute;bottom:22px;left:calc((100% - var(--sb) - 28px)/2);transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:10}
.seg{display:flex;padding:4px;border-radius:99px;background:rgba(24,24,28,.78);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 36px rgba(0,0,0,.45)}
.seg button{padding:8px 18px;border-radius:99px;font-size:13px;font-weight:600;color:#c4c4cf;transition:background .25s,color .25s;white-space:nowrap}
.seg button:hover{color:#fff}
.seg button.on{background:#fff;color:#0b0b0b;box-shadow:0 2px 12px rgba(255,255,255,.25)}
.seg button small{font-weight:500;opacity:.55;font-size:11px;margin-left:5px}
.seg .sep{width:1px;background:var(--line);margin:6px 6px}
.seg .tg{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 12px;border-radius:99px;font-size:13px;font-weight:600;color:#c4c4cf;white-space:nowrap}
.sw{width:30px;height:18px;border-radius:99px;background:#3a3a42;position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tg.on .sw{background:linear-gradient(100deg,#ffb52e,#ff4f9a)}.tg.on .sw::after{transform:translateX(12px)}
.tg.on{color:#fff}
#toast{position:absolute;left:calc((100% - var(--sb) - 28px)/2);bottom:84px;transform:translate(-50%,14px);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s, transform .35s cubic-bezier(.3,1.4,.5,1);
  display:flex;align-items:center;gap:10px;padding:11px 18px 11px 14px;border-radius:99px;background:rgba(20,20,24,.92);border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 40px rgba(0,0,0,.5);font-size:13px;font-weight:600;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:#111;background:var(--tc,#3ddc84)}
.hint{position:absolute;left:20px;bottom:26px;font-size:11px;color:#6d6d7a;z-index:5}
@media (max-width:1250px){:root{--sb:290px}.row .rl{display:none}.seg button{padding:8px 13px}.logo h1{font-size:15px}}
@media (max-height:760px){.row{padding:4px 8px}.row .ico{width:26px;height:26px}}
/* alerts: red desk badge + top banner (needs_you / stuck, from /api/alerts) */
.tag .plate b.al{display:none;font:800 10px/16px var(--font);min-width:16px;height:16px;border-radius:99px;background:#ff3b4e;color:#fff;text-align:center;margin-left:2px;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 10px #ff3b4e;animation:alp 1.2s ease-in-out infinite}

<script>
"use strict";
/* ==========================================================================
   AGENT OFFICE — single-file page (built from office/src/*)
   Runtime config is injected by the server as window.OFFICE_CONFIG:
     { title, apiBase, roster:[{ id, name, short?, role?, color, shape, aliases?, primary?, desk?, idleNote?, tasks? }] }
   ========================================================================== */
const OFFICE_CONFIG = Object.assign({ title:'Agent Office', apiBase:'/api/office', roster:null }, window.OFFICE_CONFIG || {});
const API = OFFICE_CONFIG.apiBase.replace(/\/+$/,'');

/* ========================= 1) SETTINGS (theme) ============================ */
const SETTINGS = {
  theme: {
    status: { working:'#3ddc84', needs:'#ff9d2e', idle:'#a78bfa', error:'#ff4d5e' },
    eyes:   { working:'#9ff3ff', needs:'#ffd08a', idle:'#b8a3ff', error:'#ff6b78' },
    neonTeal:'#19f0d8', neonMagenta:'#ff3fb4',
    bottleA:'#2fbf71', bottleB:'#e39a2d',        // decorative bottle colours
    floor:'#b6b1a6', wallA:'#2c4750', wallB:'#33505a',
    accentGradient:['#ffd23f','#ff9a3c','#ff4f9a']
  },
  sim: { minMs:10000, maxMs:20000, chatterMinMs:3200, chatterMaxMs:6200, maxNeeds:3 },
  camera: { focusZoom:1.5, parallax:1 },
  startMode:'now'          // 'now' | 'day' | 'evening' | 'night'
};

/* ============================ 2) BOTS (from roster) ======================== */
/* Roster entries come from the OS agent list or roster.json (see CLAUDE.md). Only id/name/color/shape are needed.
   9 desks (3×3). Bots beyond 9 share a desk (two seats). tasks[] are only used by the Demo simulation. */
const SHAPES = ['circle','square','rounded','hexagon','triangle','diamond','star','pill'];
const DEFAULT_ROSTER = [
  { id:'assistant', name:'Assistant', role:'Primary assistant', color:'#4c8dff', shape:'circle', primary:true },
  { id:'researcher', name:'Researcher', role:'Web research', color:'#ff8a3d', shape:'hexagon' },
  { id:'writer', name:'Writer', role:'Drafts & copy', color:'#38d27a', shape:'rounded' },
  { id:'analyst', name:'Analyst', role:'Data & reports', color:'#8e5cff', shape:'diamond' },
  { id:'social', name:'Social Manager', short:'Social', role:'Posting & engagement', color:'#19d3c5', shape:'triangle' },
  { id:'inbox', name:'Inbox Triage', short:'Inbox', role:'Email triage', color:'#ffc93c', shape:'square' }
];
const DEMO_TASKS = [
  { name:'Daily briefing', steps:['Collecting updates','Summarizing','Drafting briefing','Sending briefing'], chatter:['fetched 12 items','summary: 180 words','draft ready'] },
  { name:'Research request', steps:['Searching sources','Reading results','Comparing findings','Writing summary'], chatter:['search → 24 results','read 6 pages','3 key findings'],
    needs:{ atStep:4, title:'Review summary', detail:'Summary is ready for your review before it is shared.', bubble:'Review the summary?', approveLog:'summary shared', declineLog:'summary held for edits', ok:'Approved ✓ sharing…', no:'Okay — revising…', altStep:'Revising summary' } },
  { name:'Routine check', steps:['Loading checklist','Running checks','Logging results','Reporting'], chatter:['check 1/5 ok','check 3/5 ok'] }
];
const safeId = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'bot';
const BOTS = (Array.isArray(OFFICE_CONFIG.roster) && OFFICE_CONFIG.roster.length ? OFFICE_CONFIG.roster : DEFAULT_ROSTER).slice(0,18).map((r,i)=>{
  const id = safeId(r.id || r.name) + (i ? '' : '');
  return { id, name:String(r.name||id), short:r.short, role:r.role||'Agent', color:/^#[0-9a-f]{6}$/i.test(r.color||'')?r.color:'#4c8dff',
    shape:SHAPES.includes(r.shape)?r.shape:'circle', aliases:r.aliases||[], primary:!!r.primary, desk:Number.isInteger(r.desk)?r.desk:null,
    start:{ status:i%3===2?'idle':'working', task:0, step:1+(i%3) }, idleNote:r.idleNote||'Waiting for the next task',
    tasks:Array.isArray(r.tasks)&&r.tasks.length ? r.tasks : DEMO_TASKS };
});
(function assignDesks(){ // 9 desks; 10+ bots double up (seat .85 / 1.95)
  const used = {}; BOTS.forEach(b=>{ if(b.desk!=null && b.desk>=0 && b.desk<9) used[b.desk]=(used[b.desk]||0)+1; else b.desk=null; });
  BOTS.forEach(b=>{ if(b.desk!=null) return; let d=[...Array(9).keys()].find(k=>!used[k]); if(d==null) d=[...Array(9).keys()].find(k=>used[k]<2); if(d==null) d=8; b.desk=d; used[d]=(used[d]||0)+1; });
  for(let d=0; d<9; d++){ const at = BOTS.filter(b=>b.desk===d); if(at.length>1){ at[0].seat=.85; at[1].seat=1.95; at[1].sleepX=2.45; } }
})();
if(!BOTS.some(b=>b.primary) && BOTS[0]) BOTS[0].primary = true;
/* ============ 3) FEED HOOK ============
   LiveFeed (05_runtime.js) polls API+"/status" every 5s and calls Office.applyUpdate; MockFeed is only the Demo fallback.
   Anything that can call Office.applyUpdate({id, status, task, step, ...}) and Office.log(id, text)
   can drive the office (websocket, polling, SSE…). `MockFeed` below is the demo simulation. */

/* ============================== GEOMETRY ================================== */
const S = 33, ZS = 35;                       // px per world unit (horizontal half-width) / vertical unit
const W = 18.6, D = 12.6, WH = 3.7;          // floor width (x), depth (y), wall height (z)
const OX = Math.round(D*S + 70), OY = Math.round(WH*ZS + 50);
const SCENE_W = Math.round((W+D)*S + 140), SCENE_H = Math.round(OY + (W+D)*S/2 + .5*ZS + 60);
const P = (x,y,z=0) => [OX + (x-y)*S, OY + (x+y)*S/2 - z*ZS];
const pp = p => p[0].toFixed(1)+','+p[1].toFixed(1);
const pts = (...a) => a.map(pp).join(' ');
const mY  = (x,y,z) => { const p=P(x,y,z); return `matrix(${S} ${S/2} 0 ${-ZS} ${p[0].toFixed(2)} ${p[1].toFixed(2)})`; };  // plane y=c, u→+x, v up
const mYt = (x,y,z) => { const p=P(x,y,z); return `matrix(${S} ${S/2} 0 ${ZS} ${p[0].toFixed(2)} ${p[1].toFixed(2)})`; };   // v down (text)
const mX  = (x,y,z) => { const p=P(x,y,z); return `matrix(${-S} ${S/2} 0 ${-ZS} ${p[0].toFixed(2)} ${p[1].toFixed(2)})`; }; // plane x=c, u→+y, v up
const mXr = (x,y,z) => { const p=P(x,y,z); return `matrix(${S} ${-S/2} 0 ${ZS} ${p[0].toFixed(2)} ${p[1].toFixed(2)})`; };  // plane x=c, u→-y (reads left→right), v down
const mXt = (x,y,z) => { const p=P(x,y,z); return `matrix(${-S} ${S/2} 0 ${ZS} ${p[0].toFixed(2)} ${p[1].toFixed(2)})`; };
const mT  = (x,y,z) => { const p=P(x,y,z); return `matrix(${S} ${S/2} ${-S} ${S/2} ${p[0].toFixed(2)} ${p[1].toFixed(2)})`; };   // top plane: u→x, v→y
const mul32 = a => () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;

/* colour helpers */
const hex = h => { h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); };
const rgbs = c => `rgb(${c.map(v=>clamp(Math.round(v),0,255)).join(',')})`;
const mixc = (a,b,t) => a.map((v,i)=>v+(b[i]-v)*t);
const lighten = (h,t) => rgbs(mixc(hex(h),[255,255,255],t));
const darken  = (h,t) => rgbs(mixc(hex(h),[8,6,24],t));
const alpha = (h,a) => { const c=hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const tone = base => { const c = hex(base);
  return { t: rgbs(mixc(c,[255,250,240],.07)), l: rgbs(mixc(c.map(v=>v*.80),[24,34,80],.10)), r: rgbs(mixc(c.map(v=>v*.58),[22,26,76],.18)) }; };

/* dynamic gradients */
const defsEl = document.getElementById('defs'); let gN = 0; const gCache = {};
function rgrad(color, op=1, kind='soft'){
  const k = color+'|'+op+'|'+kind; if(gCache[k]) return gCache[k];
  const id = 'dg'+(gN++);

  s += wallFace(mY(0,0,0), W);

  s += `<polyline points="${lb}" stroke="${M}" stroke-width="2.4" stroke-linecap="round" fill="none"/><polyline points="${lb}" stroke="#ffe6f6" stroke-width=".9" fill="none"/>`;
  GLOW.neon.push(`<g filter="url(#fBlur8)" opacity=".9"><polyline points="${la}" stroke="${T}" stroke-width="6" fill="none"/><polyline points="${lb}" stroke="${M}" stroke-width="6" fill="none"/></g>

/* ------------------------ painter's-order topological sort ---------------- */
let lastOrderSig = '';
function sortScene(list){
  const n = list.length, EPS = .001, before = [], indeg = new Array(n).fill(0);
  for(let i=0;i<n;i++) before.push([]);
  for(let i=0;i<n;i++){ const a=list[i];
    for(let j=i+1;j<n;j++){ const b=list[j];
      const aB = a.x1<=b.x0+EPS || a.y1<=b.y0+EPS, bB = b.x1<=a.x0+EPS || b.y1<=a.y0+EPS;
      let ord = 0;                       // -1: a first, 1: b first
      if(aB && !bB) ord = -1; else if(bB && !aB) ord = 1;
      else if(!aB && !bB){ ord = a.bot===b.bot ? ((a.x0+a.x1+a.y0+a.y1) <= (b.x0+b.x1+b.y0+b.y1) ? -1 : 1) : (a.bot ? 1 : -1); }
      if(ord===-1){ before[i].push(j); indeg[j]++; } else if(ord===1){ before[j].push(i); indeg[i]++; } } }
  const key = it => it.x0+it.x1+it.y0+it.y1, done = new Array(n).fill(false), out = [];
  for(let c=0;c<n;c++){ let pick=-1, best=1e9;
    for(let i=0;i<n;i++) if(!done[i] && indeg[i]===0){ const k=key(list[i]); if(k<best){ best=k; pick=i; } }
    if(pick<0){ for(let i=0;i<n;i++) if(!done[i]){ const k=key(list[i]); if(k<best){ best=k; pick=i; } } }
    done[pick]=true; out.push(list[pick]); before[pick].forEach(j=>{ indeg[j]--; }); }
  return out;
}
function applyOrder(order){
  const sig = order.map(o=>o.id).join(','); if(sig===lastOrderSig) return; lastOrderSig = sig;
  const og = document.getElementById('objs'); order.forEach(o=>og.appendChild(o.node));
}

function needsCount(){ return STATE.bots.filter(b=>b.status==='needs').length; }
function startTask(b, idx, why){
  b.taskIdx = idx; b.step = 1; b.approved = false; b.altLabel = null; b.follow = null;
  setStatus(b,'working'); log(b, `${why}: ${b.task().name}`, '');
}
function nextTaskIdx(b){ const n=b.cfg.tasks.length; return (b.taskIdx + 1 + Math.floor(Math.random()*(n-1))) % n; }
function completeTask(b){
  log(b, `✓ completed “${b.task().name}”`, 'ok');
  if(!b.cfg.primary && Math.random()<.4){ b.taskIdx = nextTaskIdx(b); b.step=1; b.approved=false; b.altLabel=null; setStatus(b,'idle'); log(b,'going to sleep — '+b.cfg.idleNote.toLowerCase(),''); }
  else startTask(b, nextTaskIdx(b), 'picked up');
}
function progress(b){
  const t = b.task();
  log(b, `step ${b.step}/4 done — ${t.steps[b.step-1]}`, '');
  b.step++; b.altLabel = null;
  if(b.step>4){ completeTask(b); return; }
  if(t.needs && b.step===t.needs.atStep && !b.approved){
    if(needsCount()>=SETTINGS.sim.maxNeeds){ b.step--; return; }
    setStatus(b,'needs'); log(b, `waiting for you: ${t.needs.title}`, 'warn'); return; }
  if(t.fail && b.step===t.fail.step && !b.failed[b.taskIdx]){
    b.failed[b.taskIdx] = true; b.errorMsg = t.fail.msg; setStatus(b,'error'); log(b, `${t.fail.msg} — ${t.fail.detail}`, 'err'); return; }
  setStatus(b,'working');
}
function recoverError(b){
  log(b, 'retry succeeded — reconnected, resuming', 'ok'); setStatus(b,'working');
}
function toast(msg, kind='ok'){
  const t = document.getElementById('toast'); t.querySelector('span').textContent = msg;
  const i = t.querySelector('i'); i.textContent = kind==='ok'?'✓':kind==='warn'?'↺':'!'; i.style.setProperty('--tc', kind==='ok'?'#3ddc84':kind==='warn'?'#ffb23f':'#ff6b78');
  t.classList.add('on'); clearTimeout(STATE.toastT); STATE.toastT = setTimeout(()=>t.classList.remove('on'), 2900);
}
function approveBot(b){
  const n = b.task().needs; if(!n) return; b.approved = true; b.altLabel = null;
  b.temp = { kind:'speech', label:'Approved', text:n.ok, until:nowMs()+4800, color:ST.working };
  log(b, n.approveLog, 'ok'); setStatus(b,'working'); toast('Approved, the bot is continuing','ok');
  b.follow = { at: nowMs()+9000, type:'approved' };
}
function declineBot(b){
  const n = b.task().needs; if(!n) return; b.approved = true; b.altLabel = n.altStep;
  b.temp = { kind:'speech', label:'Declined', text:n.no, until:nowMs()+4800, color:ST.needs };
  log(b, n.declineLog, 'warn'); setStatus(b,'working'); toast('Declined, the bot is looking for another option','warn');
  b.follow = { at: nowMs()+11000, type:'declined' };
}
function retryBot(b){ log(b,'manual retry requested','warn'); b.temp = { kind:'speech', label:'Retrying', text:'Reconnecting to '+(b.errorMsg.includes('Redis')?'Redis':'service')+'…', until:nowMs()+3500, color:ST.working }; setStatus(b,'working'); toast('Retrying the task','warn'); b.follow = { at: nowMs()+7000, type:'retry' }; }
function runFollow(b){
  const f = b.follow; b.follow = null;
  if(f.type==='declined'){ log(b, 'alternative drafted — queued for tomorrow’s review', ''); completeTask(b); }
  else if(f.type==='retry'){ log(b, 'retry succeeded — reconnected, resuming', 'ok'); progress(b); }
  else progress(b);
}


/* ========================= LIVE FEED (real status) ========================= */
/* Polls API+'/status' (JSON array of reported statuses).
   If it returns >=1 entry -> "Live" (mock paused, every bot driven by real data; bots with no file / stale = asleep).
   If 401 / no files / network error -> "Demo" (mock simulation runs). */
const normName = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
const LiveFeed = {
  on:false, started:false, lastKey:{}, first:true, misses:0,
  botFor(name){
    const n = normName(name); if(!n) return null;
    let hit = STATE.bots.find(b=>[b.cfg.name, b.cfg.short, b.id].concat(b.cfg.aliases||[]).some(x=>normName(x)===n));
    if(!hit) hit = STATE.bots.find(b=>{ const k=normName(b.cfg.name); return k.length>5 && (n.includes(k)||k.includes(n)); });
    return hit||null;
  },
  start(){ if(this.started) return; this.started = true; this.poll(); setInterval(()=>this.poll(), 5000); },
  async poll(){
    let arr = null, code = 0;
    if(!/^https?:/.test(location.protocol)){ this.setLive(false); return; }
    try{ const r = await fetch(API+'/status', { cache:'no-store', credentials:'same-origin' }); code = r.status;
      if(r.ok){ const j = await r.json(); arr = Array.isArray(j) ? j : null; } }catch(e){ code = 0; }
    if(code===401 && /^https?:/.test(location.protocol)){ location.href = OFFICE_CONFIG.loginUrl||'/'; return; }
    if(arr && arr.length){ this.misses = 0; this.apply(arr); pollCommands(); }
    else { this.misses++; if(this.on && this.misses>=3) this.setLive(false); else if(!this.on) this.setLive(false); }
  },
  setLive(v){
    if(v===this.on && !this.first) { setIndicator(); return; }
    const was = this.on; this.on = v; this.first = false;
    if(v){ const f = document.getElementById('feedList'); f.innerHTML = ''; log(null,'connected to live status feed','ok'); }
    else { STATE.bots.forEach(b=>{ b.live = null; b.liveTask = null; }); if(was){ log(null,'live feed lost — showing demo','warn'); STATE.bots.forEach(b=>{ b.step = clamp(b.step,1,4); }); refreshUI(); } }
    setIndicator();
  },
  apply(arr){
    this.setLive(true);
    const seen = {};
    arr.forEach(e=>{ const b = this.botFor(e.name); if(!b){ return; } if(!seen[b.id] || (e.updated||0) > (seen[b.id].updated||0)) seen[b.id] = e; });
    STATE.bots.forEach(b=>{
      const e = seen[b.id];
      let u;
      if(!e) u = { id:b.id, status:'idle', live:{ state:'idle', task:'', none:true, stale:true, age:null } };
      else {
        const stale = !!e.stale || (e.age!=null && e.age>900);
        let st = ({working:'working', needs_you:'needs', needs:'needs', idle:'idle', error:'error'})[e.state] || 'idle';
        if(stale) st = 'idle';
        u = { id:b.id, status:st, errorMsg: st==='error' ? (e.task||'Error') : undefined,
              live:{ state:e.state, task:e.task||'', with:Array.isArray(e.with)?e.with:(e.with?[e.with]:[]), step:e.step, total:e.total, stale, age:e.age, updated:e.updated, none:false } };
      }
      const key = u.status+'|'+u.live.task+'|'+u.live.step+'|'+u.live.total+'|'+u.live.stale;
      const changed = this.lastKey[b.id] !== key; const firstSeen = this.lastKey[b.id]===undefined;
      this.lastKey[b.id] = key;
      Office.applyUpdate(u);
      if(changed && (u.live.task || !firstSeen)){
        const k = u.status==='error'?'err':u.status==='needs'?'warn':'';
        const tail = u.live.step ? ` (${u.live.step}${u.live.total?'/'+u.live.total:''})` : '';
        log(b, u.live.stale ? (u.live.none ? 'no status reported — asleep' : 'status stale — asleep · last: '+u.live.task) : (statusLabel[u.status]+': '+u.live.task+tail), k);
      }
    });
    setIndicator();
  }
};
/* ============================ ALERTS (lean) ===============================
   Worker detects needs_you / stuck and dedupes (one alert per state change, cooldown; phone push via ntfy).
   Page polls /api/alerts every 15s: red badge on the desk plate, banner, optional browser Notification. */
const Alerts = {
  list:[], known:{}, dismissed:JSON.parse(localStorage.getItem('officeAlertsDismissed')||'{}'), started:false,
  key:a=>a.slug+'|'+a.kind+'|'+a.since,
  start(){ if(this.started) return; this.started = true; this.poll(); setInterval(()=>this.poll(), 15000); },
  async poll(){
    if(!/^https?:/.test(location.protocol)) return;
    try{ const r = await fetch(API+'/alerts', { cache:'no-store', credentials:'same-origin' }); if(!r.ok) return; const j = await r.json(); this.set(Array.isArray(j.alerts)?j.alerts:[]); }catch(e){}
  },
  set(arr){
    const first = !Object.keys(this.known).length && !this.list.length; this.list = arr;
    const live = {}; arr.forEach(a=>{ const k = this.key(a); live[k] = 1;
      if(!this.known[k] && !first){ const b = LiveFeed.botFor(a.name); log(b, a.kind==='stuck'?'looks stuck — no update for a while':'needs you: '+(a.task||'waiting'), 'err'); this.notify(a); } });
    this.known = live; Object.keys(this.dismissed).forEach(k=>{ if(!live[k]) delete this.dismissed[k]; }); this.save();
    STATE.bots.forEach(b=>{ b.alert = null; });
    arr.forEach(a=>{ const b = LiveFeed.botFor(a.name); if(b && !this.dismissed[this.key(a)]) b.alert = a; });
    STATE.bots.forEach(b=>updateTag(b)); this.render();
  },
  save(){ try{ localStorage.setItem('officeAlertsDismissed', JSON.stringify(this.dismissed)); }catch(e){} },
  dismiss(k){ this.dismissed[k] = 1; this.save(); this.set(this.list); },
  render(){
    const el = document.getElementById('alertBar'); if(!el) return;
    const vis = this.list.filter(a=>!this.dismissed[this.key(a)]);
    el.classList.toggle('on', vis.length>0);
    el.innerHTML = vis.slice(0,3).map(a=>{ const b = LiveFeed.botFor(a.name), nm = b ? (b.cfg.short||b.cfg.name) : a.name;
      return `<div class="al-i" data-k="${esc(this.key(a))}" data-id="${b?b.id:''}"><i class="k">${a.kind==='stuck'?'Stuck?':'Needs you'}</i><span><b>${esc(nm)}</b> · ${esc(a.task||(a.kind==='stuck'?'No update for a while':'Waiting for your input'))}</span><button title="Dismiss" data-x="1">✕</button></div>`; }).join('')
      + (vis.length>3 ? `<div class="al-n">+${vis.length-3} more</div>` : '')
      + (('Notification' in window) && Notification.permission==='default' ? `<button class="al-n" data-perm="1">Enable desktop notifications</button>` : '');
    el.onclick = e=>{ const t = e.target;
      if(t.dataset.perm){ Notification.requestPermission().then(()=>this.render()); return; }
      const it = t.closest('.al-i'); if(!it) return;
      if(t.dataset.x){ e.stopPropagation(); this.dismiss(it.dataset.k); return; }
      if(it.dataset.id) selectBot(it.dataset.id, true); };
  },
  notify(a){
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    try{ const n = new Notification(a.kind==='stuck' ? a.name+' looks stuck' : a.name+' needs you', { body:a.task||'', tag:'office-'+a.slug }); n.onclick = ()=>{ window.focus(); const b = LiveFeed.botFor(a.name); if(b) selectBot(b.id, true); }; }catch(e){}
  }
};
function buildLiveTask(b){
  const l = b.live, nm = l.task || (l.none ? 'No status reported yet' : 'Idle');
  b.liveTask = { name:nm, steps:[nm,nm,nm,nm], chatter:[],
    needs:{ title:'Needs you', detail:nm, bubble:nm } };
}
function ago(sec){ if(sec==null) return ''; if(sec<60) return sec+'s ago'; if(sec<3600) return Math.round(sec/60)+' min ago'; if(sec<86400) return Math.round(sec/3600)+' h ago'; return Math.round(sec/86400)+' d ago'; }
function setIndicator(){
  const el = document.getElementById('liveInd'); if(!el) return;
  const on = LiveFeed.on; el.className = 'pill live '+(on?'on':'demo');
  el.innerHTML = `<i></i><b>${on?'Live':'Demo'}</b>`;
  el.title = on ? 'Showing real bot status (updates every 5s)' : 'Showing simulated demo data — no live status available';
  const fl = document.getElementById('feedLive'); if(fl) fl.innerHTML = `<span class="dot${on?'':' demo'}"></span>${on?'live':'demo'}`;
}

/* ========================= MOCK FEED (simulation) ========================= */
const MockFeed = {
  started:false,
  start(){
    if(this.started) return; this.started = true;
    const tick = () => { this.tick(); setTimeout(tick, rand(SETTINGS.sim.minMs, SETTINGS.sim.maxMs)); };
    const chat = () => { this.chatter(); setTimeout(chat, rand(SETTINGS.sim.chatterMinMs, SETTINGS.sim.chatterMaxMs)); };
    setTimeout(tick, rand(6000,10000)); setTimeout(chat, 2500);
  },
  tick(){
    if(LiveFeed.on) return;
    const w = [], tm = nowMs();
    STATE.bots.forEach(b=>{ if(b.follow) return; if(b.status==='working') w.push([b,3]); else if(b.status==='idle') w.push([b,1.3]); else if(b.status==='error' && tm-b.since>22000) w.push([b,2.5]); });
    if(!w.length) return; let r = Math.random()*w.reduce((a,x)=>a+x[1],0), b = w[0][0]; for(const x of w){ r-=x[1]; if(r<=0){ b=x[0]; break; } }
    if(b.status==='working') progress(b); else if(b.status==='idle') startTask(b, b.taskIdx, 'woke up'); else if(b.status==='error') recoverError(b);
  },
  chatter(){
    if(LiveFeed.on) return;
    const ws = STATE.bots.filter(b=>b.status==='working'); if(!ws.length) return; const b = pick(ws), c = b.task().chatter;
    log(b, c && c.length ? pick(c) : b.task().steps[b.step-1]);
  }
};

const $ = id => document.getElementById(id);
const statusLabel = { working:'Working', needs:'Needs you', idle:'Idle', error:'Error' };
function iconSvg(b, size=20){
  ensureArtDefs(b); const A = artFor(b), pid = 'ba'+b.idx, ec = lighten(EY[b.status],.55), s2 = size*1.22;
  return `<svg width="${s2.toFixed(1)}" height="${s2.toFixed(1)}" viewBox="-25 -63 50 66" overflow="visible">${A.body(pid,true)}<circle cx="${-b.ex}" cy="${b.ey}" r="4.6" fill="rgba(6,8,18,.7)"/><circle cx="${b.ex}" cy="${b.ey}" r="4.6" fill="rgba(6,8,18,.7)"/><circle cx="${-b.ex}" cy="${b.ey}" r="3.2" fill="${ec}"/><circle cx="${b.ex}" cy="${b.ey}" r="3.2" fill="${ec}"/></svg>`;
}
function statusText(b){
  if(b.live){ const l=b.live; if(l.stale||b.status==='idle') return l.none ? 'No status reported — asleep' : 'Asleep · '+(l.task||'idle')+(l.age!=null?' · '+ago(l.age):''); return l.task||statusLabel[b.status]; }
  const t = b.task();
  if(b.status==='working') return (b.altLabel || t.steps[clamp(b.step,1,4)-1]);
  if(b.status==='needs') return t.needs ? t.needs.title : 'Waiting for you';
  if(b.status==='error') return b.errorMsg;
  return b.cfg.idleNote;
}

function renderTaskInner(){

  if(b.live){ renderLiveTask(el,b); return; }
  const t = b.task(); el.style.setProperty('--bc', b.color);
  const needsAtt = b.status==='needs', err = b.status==='error', idle = b.status==='idle';
  const cur = clamp(b.step,1,4);
  const items = t.steps.map((s,i)=>{ const n=i+1; let cls='';
    if(idle) cls = ''; else if(n<cur) cls='d'; else if(n===cur) cls = needsAtt?'w':err?'e':'c'; 
    const ic = cls==='d'?'✓':cls==='w'?'!':cls==='e'?'×':'';
    return `<li class="${cls}"><span class="ic">${ic}</span><span>${esc((n===cur&&b.altLabel&&b.status==='working')?b.altLabel:s)}</span></li>`; }).join('');
  const bars = t.steps.map((s,i)=>{ const n=i+1; let cls=''; if(!idle){ if(n<cur) cls='d'; else if(n===cur) cls = needsAtt?'w':err?'e':'c'; } return `<i class="${cls}"></i>`; }).join('');
  let callout = '', btns = '';
  if(needsAtt && t.needs){
    callout = `<div class="callout" style="--cc:${ST.needs}"><b>${esc(t.needs.title)}</b>${esc(t.needs.detail)}</div>`;

  } else if(err){
    const f = t.fail; callout = `<div class="callout" style="--cc:${ST.error}"><b>${esc(b.errorMsg)}</b>${esc(f?f.detail:'The task stopped unexpectedly.')}</div>`;
    btns = `<div class="btns"><button class="btn dc" data-act="retry">Retry task</button></div>`;
  } else if(idle){
    callout = `<div class="callout" style="--cc:${ST.idle}"><b>Sleeping</b>${esc(b.cfg.idleNote)}</div>`;
  }
  el.innerHTML = `<div class="tk-h"><div class="ico">${iconSvg(b,22)}</div><div class="t"><b>${esc(b.cfg.name)}</b><span>${esc(b.cfg.role)}</span></div><span class="badge st-${b.status}"><i></i>${statusLabel[b.status]}</span></div>
    <div class="tk-name">${esc(idle?'Next up: '+t.name:t.name)}</div>
    <div class="stepline"><span>${idle?'Not started':`<b>Step ${cur} of 4</b>`}</span><span>${idle?'':needsAtt?'Waiting on you':err?'Stopped':'In progress'}</span></div>
    <div class="bars">${bars}</div><ul class="chk">${items}</ul>${callout}${btns}`;

function renderLiveTask(el,b){
  const l=b.live, st=b.status; el.style.setProperty('--bc', b.color);
  const hasStep = l.step!=null && l.total, cur = hasStep ? clamp(l.step,0,l.total) : 0;
  const bars = hasStep ? Array.from({length:Math.min(l.total,12)},(_,i)=>{ const n=i+1; let cls=''; if(st!=='idle'){ if(n<=cur-1+(st==='working'||st==='needs'||st==='error'?0:1)) cls='d'; else if(n===cur) cls = st==='needs'?'w':st==='error'?'e':'c'; } return `<i class="${cls}"></i>`; }).join('') : '';

    ${bars?`<div class="bars">${bars}</div>`:''}${callout}${controlsHtml(b)}`;

/* ---- two-way control (live mode): POST /api/command, delivery state from /api/commands ---- */
const CMD = { list:[], seen:{} };
const cmdStateLabel = { queued:'queued', delivered:'delivered to box', seen:'seen by bot' };
function controlsHtml(b){
  const st = b.status, mine = CMD.list.filter(c=>c.bot===b.cfg.name).slice(-3).reverse();
  const ap = st==='needs' ? `<div class="btns"><button class="btn ap" data-act="cmd-approve">Approve</button><button class="btn dc" data-act="cmd-decline">Decline</button></div>` : '';
  const hist = mine.length ? `<ul class="cmdh">${mine.map(c=>`<li><b>${esc(c.action)}</b>${c.text?' · '+esc(c.text.slice(0,60)):''}<span class="cs cs-${c.state}">${cmdStateLabel[c.state]||esc(c.state)}</span></li>`).join('')}</ul>` : '';
  return `${ap}<div class="nudge"><textarea id="nudgeTxt" maxlength="500" rows="2" placeholder="Nudge ${esc(b.cfg.short||b.cfg.name)}… (sent to the bot's inbox)">${esc(b.draft||'')}</textarea><button class="btn dc" data-act="cmd-nudge">Send nudge</button></div>${hist}`;
}
async function sendCommand(b, action, text){
  try{
    const r = await fetch(API+'/command', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json','X-Office':'1'}, body: JSON.stringify({ bot:b.cfg.name, action, text:text||'' }) });
    if(r.status===401){ location.href=OFFICE_CONFIG.loginUrl||'/'; return false; }
    if(!r.ok){ toast('Command failed ('+r.status+')','warn'); return false; }
    const c = await r.json(); CMD.list.push(c); CMD.seen[c.id] = c.state;
    log(b, `${action}${text?' “'+text.slice(0,80)+'”':''} → queued`, 'ok'); toast(`${action[0].toUpperCase()+action.slice(1)} queued for ${b.cfg.short||b.cfg.name}`,'ok'); refreshUI(); return true;
  }catch(e){ toast('Command failed (network)','warn'); return false; }
}
async function pollCommands(){
  try{ const r = await fetch(API+'/commands', { cache:'no-store', credentials:'same-origin' }); if(!r.ok) return; const arr = await r.json(); if(!Array.isArray(arr)) return;
    const first = !CMD.loaded; CMD.loaded = true; let ch = false;

    if(!A){ const p = pairs[k], id = 'cg'+Object.keys(Collab.arcs).length+Math.floor(Math.random()*1e4);
      const g = document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','arc'); g.setAttribute('opacity','0');
      g.innerHTML = `<defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${p.a.cfg.color}"/><stop offset="1" stop-color="${p.b.cfg.color}"/></linearGradient></defs>
        <path class="h" fill="none" stroke="url(#${id})" stroke-width="7" stroke-linecap="round" opacity=".16" filter="url(#fBlur8)"/>
        <path class="c" fill="none" stroke="url(#${id})" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>
        <path class="pulse" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".7" pathLength="100" stroke-dasharray="12 100" filter="url(#fBlur3)"/>`;
      svg.appendChild(g); A = Collab.arcs[k] = { g, grad:g.querySelector('linearGradient') };
      requestAnimationFrame(()=>requestAnimationFrame(()=>g.setAttribute('opacity','1')));
    }
    A.pair = pairs[k]; A.dead = false; clearTimeout(A.kill);
    const end = b => { const q = b.scr || P(b.x,b.y,b.z); return [q[0], q[1]-(b.hovPx||6)-34]; }, pa = end(A.pair.a), pb = end(A.pair.b);
    const mx=(pa[0]+pb[0])/2, my=Math.min(pa[1],pb[1]) - (Math.hypot(pb[0]-pa[0],pb[1]-pa[1])*.38 + 70);
    const d = `M${pa[0].toFixed(0)},${pa[1].toFixed(0)} Q${mx.toFixed(0)},${my.toFixed(0)} ${pb[0].toFixed(0)},${pb[1].toFixed(0)}`, _u = `M${pa[0].toFixed(1)},${pa[1].toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${pb[0].toFixed(1)},${pb[1].toFixed(1)}`;
    if(A.d!==d){ A.d=d; A.g.querySelectorAll('path').forEach(p=>p.setAttribute('d',d));
      A.grad.setAttribute('x1',pa[0]); A.grad.setAttribute('y1',pa[1]); A.grad.setAttribute('x2',pb[0]); A.grad.setAttribute('y2',pb[1]); }
  }
  for(const k in Collab.arcs){ const A = Collab.arcs[k]; if(!pairs[k] && !A.dead){ A.dead = true; A.g.setAttribute('opacity','0'); A.kill = setTimeout(()=>{ A.g.remove(); delete Collab.arcs[k]; }, reduce?0:1300); } }
  // side strip
  const keys = Object.keys(pairs).sort(), sig = keys.map(k=>k+'|'+pairs[k].task).join('#');
  if(sig!==Collab.sig){ Collab.sig = sig; const box = document.getElementById('collabs'); if(!box) return;
    box.hidden = !keys.length; document.getElementById('collabN').textContent = keys.length ? keys.length+' active' : '';
    const esc = t => String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
    document.getElementById('collabList').innerHTML = keys.map(k=>{ const p = pairs[k];
      return `<div class="cp"><div class="pr"><span style="color:${p.a.cfg.color}">●</span> ${esc(p.a.cfg.short||p.a.cfg.name)}<i>⇄</i><span style="color:${p.b.cfg.color}">●</span> ${esc(p.b.cfg.short||p.b.cfg.name)}</div><div class="tk">${esc(p.task)}</div></div>`; }).join(''); }
}
setInterval(collabTick, 500);

</script>
